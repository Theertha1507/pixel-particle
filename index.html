<!DOCTYPE html>
<html>

    <head>
        <title>ASCII VIEWER</title>
        <style>
            body {
                margin: 0;
                background: black;
                overflow: hidden;
            }

            canvas {
                display: block;
            }
        </style>
    </head>

    <body>
        <canvas id="canvas"></canvas>
        <script type="module">
            import { asciiData } from "./output/asciiData.js";
            import { createNoise2D } from "https://cdn.skypack.dev/simplex-noise";
            const noise2D = createNoise2D();
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            ctx.font = "8px monospace";
            ctx.fillStyle = "white";
            let time = 0;
            const mouse = {
                x: -9999,
                y: -9999
            };
            window.addEventListener("mousemove", (e) => {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });
            window.addEventListener("mouseleave", () => {
                mouse.x = -9999;
                mouse.y = -9999;
            });
            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "black";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                const offsetX = canvas.width / 2 - 200;
                const offsetY = canvas.height / 2 - 200;
                for (const p of asciiData) {
                    const baseX = p.x + offsetX;
                    const baseY = p.y + offsetY;
                    const dx = mouse.x - baseX;
                    const dy = mouse.y - baseY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    let drawX = baseX;
                    let drawY = baseY;
                    if (distance < 180) {
                        const influence = (180 - distance) / 180;
                        const nx = noise2D(
                            p.x * 0.02,
                            time
                        );
                        const ny = noise2D(
                            p.y * 0.02,
                            time + 100
                        );
                        drawX += nx * influence * 40;
                        drawY += ny * influence * 40;
                    }
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = "white";
                    ctx.fillText(
                        p.char,
                        drawX,
                        drawY
                    );
                }
                ctx.globalAlpha = 1;
                time += 0.01;
                requestAnimationFrame(animate);
            }
            animate();
            window.addEventListener("resize", () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        </script>
    </body>

</html>
